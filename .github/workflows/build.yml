name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 给 gradlew 加执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug APK
        env:
          JAVA_TOOL_OPTIONS=-Xmx64m
          GRADLE_OPTS: ""
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: AcControl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
